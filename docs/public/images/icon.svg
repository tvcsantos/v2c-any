<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#13263c"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- left brace -->
  <path d="M 148 146
           C 116 146 118 162 118 192
           L 118 226
           C 118 246 108 256 92 256
           C 108 256 118 266 118 286
           L 118 320
           C 118 350 116 366 148 366"
        fill="none" stroke="#3e5a78" stroke-width="24" stroke-linecap="round"/>

  <!-- right brace -->
  <path d="M 364 146
           C 396 146 394 162 394 192
           L 394 226
           C 394 246 404 256 420 256
           C 404 256 394 266 394 286
           L 394 320
           C 394 350 396 366 364 366"
        fill="none" stroke="#3e5a78" stroke-width="24" stroke-linecap="round"/>

  <!-- lightning bolt -->
  <path d="M 300 104 L 176 288 L 246 288 L 222 408 L 344 216 L 272 216 Z"
        fill="url(#bolt)" filter="url(#glow)"/>
</svg>
